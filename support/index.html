<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fdfcfa" />
    <script>
      (() => {
        try {
          const key = 'rustchamber-theme';
          const saved = localStorage.getItem(key);
          const theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#12110f' : '#fdfcfa');
        } catch {}
      })();
    </script>
    <meta name="description" content="Get help with RustChamber. Documentation, GitHub issues and answers to common questions." />
    <link rel="canonical" href="https://rustchamber.lipecode.com/support/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RustChamber" />
    <meta property="og:title" content="Support – RustChamber" />
    <meta property="og:description" content="Get help with RustChamber. Documentation, GitHub issues and answers to common questions." />
    <meta property="og:url" content="https://rustchamber.lipecode.com/support/" />
    <meta property="og:image" content="https://assets-projects.lipecode.com/rustchamber/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Support – RustChamber" />
    <meta name="twitter:description" content="Get help with RustChamber. Documentation, GitHub issues and answers to common questions." />
    <meta name="twitter:image" content="https://assets-projects.lipecode.com/rustchamber/og.jpg" />
    <title>Support – RustChamber</title>
  </head>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
