<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fdfcfa" />
    <script>
      (() => {
        try {
          const key = 'rustchamber-theme';
          const saved = localStorage.getItem(key);
          const theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#12110f' : '#fdfcfa');
        } catch {}
      })();
    </script>
    <meta name="description" content="RustChamber is a native desktop workspace for OpenCode, written in Rust. Chat, files, changes, git and terminal in one window." />
    <link rel="canonical" href="https://rustchamber.lipecode.com/" />
    <link rel="preconnect" href="https://assets-projects.lipecode.com" crossorigin />
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
