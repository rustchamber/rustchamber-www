<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fdfcfa" />
    <script>
      (() => {
        try {
          const key = 'rustchamber-theme';
          const saved = localStorage.getItem(key);
          const theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#12110f' : '#fdfcfa');
        } catch {}
      })();
    </script>
    <meta name="description" content="RustChamber is a native desktop workspace for OpenCode, written in Rust. Chat, files, changes, git and terminal in one window." />
    <title>RustChamber – Agentic Development Environment for AI Coding</title>
  </head>
  <body data-page="home">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
